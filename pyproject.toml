[tool.poetry]
name = "foodshot"
version = "0.1.0"
description = "Telegram bot for people with diabetes: food photo -> calorie count + insulin dose recommendation"
authors = ["soroqn <yaroslavsorocan89@gmail.com>"]
readme = "README.md"
packages = [{include = "bot"}, {include = "db"}, {include = "services"}, {include = "core"}, {include = "api"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aiogram = "^3.15.0"
fastapi = "^0.115.0"
uvicorn = "^0.27.1"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
redis = "^5.2.0"
openai = "^1.54.0"
httpx = "^0.27.0"
python-multipart = "^0.0.12"
greenlet = "^3.1.1"
aiogram-i18n = {extras = ["fluent"], version = "^1.4.1"}
fluent-runtime = "^0.4.0"
"fluent.compiler" = "^0.3.0"
alembic = "^1.18.5"
loguru = "^0.7.3"
aiohttp = "^3.14.1"
pillow = "^12.3.0"
textual = "^8.2.8"
langfuse = "^4.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "bot", "core", "db", "services"]
